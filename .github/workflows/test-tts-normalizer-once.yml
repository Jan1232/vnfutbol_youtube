name: Test Russian TTS normalizer once

on:
  push:
    paths:
      - ".github/workflows/test-tts-normalizer-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_voice_normalizer.py
